[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfence"
version = "1.0.0"
description = "Dry-run capability firewall, blast-radius simulator, and hash-chained audit ledger for AI coding agents."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mohammadreza Zare (mrzroot)" }]
requires-python = ">=3.9"
keywords = ["ai", "agents", "security", "firewall", "sandbox", "audit-log", "blast-radius", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://mrzroot.github.io/agentfence/"
Repository = "https://github.com/mrzroot/agentfence"

[project.scripts]
agentfence = "agentfence.cli:main"

[tool.setuptools]
packages = ["agentfence"]
